          sortKey: -1789403090069
        method: POST
        body:
          mimeType: application/json
          text: >
            {
            	"lastActiveAt": "2026-09-14T11:38:00-05:00",
            	"userId":"c3091246-2f1c-463f-9055-80acf82176d5",
            	"messages": [
                {
                    "parts": [
                        {
                            "type": "text",
                            "text": "Hola"
                        }
                    ],
                    "id": "Y9zcfjJjxFvqJObI",
                    "role": "user"
                },
                {
                    "id": "767e6e85-ad0f-4f28-9abf-bd929aa01cb0",
                    "role": "assistant",
                    "parts": [
                        {
                            "type": "text",
                            "text": "¡Hola! 👋  \nSoy un especialista en medicina natural tradicional y estoy aquí para ayudarte a encontrar remedios naturales que se adapten a tus necesidades.\n\nPara poder recomendarte el remedio más adecuado, por favor cuéntame un poco más acerca de los síntomas que estás experimentando (por ejemplo, dolor de cabeza, malestar estomacal, insomnio, problemas de la piel, etc.) y si tienes alguna preferencia o restricción (alergias, embarazo, uso de medicamentos, etc.).\n\nUna vez que me des esa información, podré indicarte la hierba o combinación de hierbas más apropiada, detallarte paso a paso cómo prepararla, sus características, dosis recomendadas y, al final, incluiré el enlace al registro correspondiente en nuestra base de datos (http://localhost:3000/herb/{herb_id}). \n\n¡Quedo atenta a tus síntomas! 🌿",
                            "state": "done"
                        }
                    ]
                },
                {
                    "parts": [
                        {
                            "type": "text",
                            "text": "Qué es el acetaminofen"
                        }
                    ],
                    "id": "nUQy3OakVTDaMxG0",
                    "role": "user"
                },
                {
                    "id": "12fe51bd-3e37-479e-8fcd-1ac587a37498",
                    "role": "assistant",
                    "parts": [
                        {
                            "type": "text",
                            "text": "**Acetaminofén (también conocido como paracetamol)**  \n\n| Aspecto | Detalle |\n|---------|---------|\n| **Clase farmacológica** | Analgésico y antipirético (reduce el dolor y la fiebre). |\n| **Mecanismo de acción** | Inhibe de forma reversible la enzima **ciclooxigenasa (COX)**, principalmente la isoforma COX‑2, en el sistema nervioso central. Esto disminuye la síntesis de prostaglandinas que median la sensación de dolor y la respuesta febrífuga, sin producir una inflamación significativa en los tejidos periféricos. |\n| **Indicaciones habituales** | - Dolor leve‑moderado (cefalea, dolor dental, dolor muscular, dolor articular).<br>- Fiebre de origen viral o bacteriano.<br>- Alivio de molestias asociadas a resfriados y gripe. |\n| **Dosis habituales en adultos** | - **Tabletas de 500 mg**: 1‑2 comprimidos cada 4‑6 h, sin superar 4 g/24 h.<br>- **Suspensión oral (250 mg/5 ml)**: 10‑20 ml cada 4‑6 h, máximo 60 ml/24 h. |\n| **Dosis en niños** (según peso) | Aproximadamente **10‑15 mg/kg** cada 4‑6 h, sin superar **75 mg/kg/día** ni 4 g/24 h en total. Siempre se debe usar la formulación pediátrica y una jeringa o cuchara dosificadora. |\n| **Efectos secundarios más frecuentes** | - Reacciones alérgicas leves (erupción cutánea).<br>- Náuseas o malestar estomacal. |\n| **Riesgos graves** | - **Hepatotoxicidad**: daño hepático agudo o crónico cuando se supera la dosis máxima o se combina con alcohol/otros hepatotóxicos. <br>- Reacción de Stevens‑Johnson (muy rara). |\n| **Contraindicaciones** | - Insuficiencia hepática grave.<br>- Hipersensibilidad conocida al acetaminofén.<br>- Uso concomitante de otros fármacos que contengan acetaminofén (para evitar sobredosis). |\n| **Interacciones importantes** | - **Warfarina**: puede potenciar el efecto anticoagulante.<br>- **Alcohol**: aumenta el riesgo de daño hepático.<br>- **Inductores de CYP2E1** (ej. isoniazida, rifampicina) pueden acelerar la metabolización a metabolitos tóxicos. |\n| **Precauciones** | - No combinar con otros analgésicos que contengan acetaminofén (ej. algunos analgésicos combinados, medicamentos para resfriado).<br>- Revisar siempre la etiqueta de productos de venta libre (ex.: jarabes, pastillas para la tos) para evitar duplicación. |\n| **Alternativas naturales (para dolor leve‑moderado y fiebre)** | A continuación, te presento una opción herbal que ha sido utilizada tradicionalmente para aliviar dolores de cabeza, fiebre y malestar general, con una preparación detallada. |\n\n---\n\n## **Remedio natural recomendado: Infusión de *Salvia officinalis* (Salvia común) y *Zingiber officinale* (Jengibre)**  \n\nEsta combinación combina las propiedades **analgésicas y antipiréticas** de la salvia con el **efecto termogénico y antiinflamatorio** del jengibre, ofreciendo una alternativa suave cuando se busca evitar el acetaminofén o complementarlo bajo supervisión médica.\n\n### 1. Ingredientes\n\n| Ingrediente | Cantidad (para 1 taza) | Propiedades principales |\n|-------------|------------------------|--------------------------|\n| Hojas secas de **Salvia officinalis** | 1 g (aprox. 1 cucharadita) | Antiinflamatoria, antioxidante, ayuda a regular la temperatura corporal. |\n| Raíz fresca de **Jengibre** | 2 cm (≈ 5 g) rallada | Analgésico, antiinflamatorio, estimula la circulación y tiene efecto antipirético. |\n| Agua filtrada | 250 ml | — |\n| Miel (opcional) | 1 cucharadita | Potenciador del sabor y aporte antibacteriano. |\n| Limón (opcional) | 1 rodaja | Aporta vitamina C y mejora la absorción de compuestos activos. |\n\n### 2. Utensilios\n\n- Tetera o cazo pequeño con tapa.  \n- Colador fino o filtro de tela.  \n- Taza de cerámica o vidrio.  \n- Cuchara medidora.  \n\n### 3. Proceso de preparación paso a paso\n\n1. **Limpieza y preparación**  \n   - Lava la raíz de jengibre bajo agua corriente.  \n  ",
                            "state": "done"
                        }
                    ]
                },
                {
                    "parts": [
                        {
                            "type": "text",
                            "text": "Recuerdame que pregunta te hice"
                        }
                    ],
                    "id": "IgVhOqu05pzsR2IB",
                    "role": "user"
                },
                {
                    "id": "83d71ebb-f83f-4ea9-b28c-bdf6726fdacf",
                    "role": "assistant",
                    "parts": [
                        {
                            "type": "text",
                            "text": "Claro, con gusto.  \n\n**Tu pregunta anterior fue:**  \n\n> **“Qué es el acetaminofén.”**  \n\nMe solicitaste una explicación sobre esa sustancia, y te proporcioné información detallada acerca de su clase farmacológica, mecanismo de acción, indicaciones, dosis, efectos secundarios, contraindicaciones, interacciones y algunas precauciones, además de una alternativa natural basada en hierbas.",
                            "state": "done"
                        }
                    ]
                }
            ]


            }
