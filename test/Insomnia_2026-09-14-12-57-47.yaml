      - url: "{{ base_url }}/auth/login/verify-2fa"
        name: 3. Verify 2FA
        meta:
          id: req_a05d0d27b0f74235a198999a139c536f
          created: 1787763893884
          modified: 1789089979491
          isPrivate: false
          description: Usa el código que llegó al correo. rememberDevice=true setea la
            cookie httpOnly (Insomnia la guarda sola en su cookie jar). Copia
            access_token de la respuesta a la variable access_token.
          sortKey: -1787763893932
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "code": "367014",
              "rememberDevice": false
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: bearer
          token: "{{ _.access_token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ base_url }}/auth/login/resend-code"
