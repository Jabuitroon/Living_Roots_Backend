        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ base_url }}/auth/login"
        name: 6. Login (dispositivo ya confiable)
        meta:
          id: req_4c951b744b4c4c4694d820ea90ff2c12
