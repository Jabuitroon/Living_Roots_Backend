        meta:
          id: req_f2542cb3b7224eb79823a73d20e576eb
          created: 1787763893889
          modified: 1787763920042
          isPrivate: false
          description: Invalida el código anterior y envía uno nuevo. Requiere el mismo
            preAuthToken del paso 1 o 2.
          sortKey: -1787763893919.5
        method: POST
        body:
          mimeType: application/json
          text: ""
        headers:
          - name: Authorization
            value: Bearer {{ pre_auth_token }}
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ base_url }}/auth/profile"
