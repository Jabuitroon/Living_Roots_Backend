          created: 1787763893878
          modified: 1788582189774
          isPrivate: false
          description: "Con credenciales de un usuario ya registrado. Sin cookie de
            dispositivo confiable, responde { requires2FA: true, preAuthToken }.
            Copia preAuthToken a pre_auth_token."
          sortKey: -1787763893957
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "buicynxbox3602020@gmail.com",
